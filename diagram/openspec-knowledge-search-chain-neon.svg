<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>

    <!-- Glow filters -->
    <filter id="glow-cyan">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-green">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-orange">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-yellow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-pink">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00aaff"/>
    </marker>
    <marker id="arrow-green" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#00ff44"/>
    </marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff8800"/>
    </marker>
    <marker id="arrow-yellow" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ffee00"/>
    </marker>
    <marker id="arrow-pink" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#ff0066"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#64748b"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="30" y="36" fill="white" font-size="16" font-weight="700">knowledge-search 四文件串联关系</text>
  <text x="30" y="54" fill="#94a3b8" font-size="10">OpenSpec change: add-mcp-knowledge-server</text>

  <!-- ═══ Proposal Box (Bright Blue) ═══ -->
  <g filter="url(#glow-cyan)">
    <rect x="40" y="100" width="180" height="80" rx="8" fill="#0f172a"/>
    <rect x="40" y="100" width="180" height="80" rx="8" fill="rgba(0,170,255,0.08)" stroke="#00aaff" stroke-width="3"/>
    <text x="130" y="126" fill="#00aaff" font-size="11" font-weight="700" text-anchor="middle">proposal.md</text>
    <text x="130" y="143" fill="white" font-size="9" font-weight="600" text-anchor="middle">Capabilities</text>
    <text x="130" y="158" fill="#94a3b8" font-size="8" text-anchor="middle">knowledge-search</text>
  </g>

  <!-- Arrow -->
  <line x1="220" y1="140" x2="280" y2="140" stroke="#00aaff" stroke-width="2" marker-end="url(#arrow-cyan)"/>
  <text x="250" y="132" fill="#94a3b8" font-size="7" text-anchor="middle">"为什么"</text>
  <text x="250" y="155" fill="#64748b" font-size="7" text-anchor="middle">→ "怎么做"</text>

  <!-- ═══ Design Box (Bright Green) ═══ -->
  <g filter="url(#glow-green)">
    <rect x="290" y="100" width="180" height="80" rx="8" fill="#0f172a"/>
    <rect x="290" y="100" width="180" height="80" rx="8" fill="rgba(0,255,68,0.08)" stroke="#00ff44" stroke-width="3"/>
    <text x="380" y="126" fill="#00ff44" font-size="11" font-weight="700" text-anchor="middle">design.md</text>
    <text x="380" y="143" fill="white" font-size="9" font-weight="600" text-anchor="middle">Decisions</text>
    <text x="380" y="158" fill="#94a3b8" font-size="8" text-anchor="middle">jieba + 倒排索引 + 字段加权</text>
  </g>

  <!-- Arrow -->
  <line x1="470" y1="140" x2="530" y2="140" stroke="#00ff44" stroke-width="2" marker-end="url(#arrow-green)"/>
  <text x="500" y="132" fill="#94a3b8" font-size="7" text-anchor="middle">"怎么做"</text>
  <text x="500" y="155" fill="#64748b" font-size="7" text-anchor="middle">→ "什么契约"</text>

  <!-- ═══ Spec Box (Bright Orange) ═══ -->
  <g filter="url(#glow-orange)">
    <rect x="540" y="90" width="200" height="100" rx="8" fill="#0f172a"/>
    <rect x="540" y="90" width="200" height="100" rx="8" fill="rgba(255,136,0,0.08)" stroke="#ff8800" stroke-width="3"/>
    <text x="640" y="116" fill="#ff8800" font-size="11" font-weight="700" text-anchor="middle">specs/knowledge-search/spec.md</text>
    <text x="640" y="133" fill="white" font-size="9" font-weight="600" text-anchor="middle">Tool: search_articles</text>
    <text x="640" y="148" fill="#94a3b8" font-size="8" text-anchor="middle">keyword / limit / source 参数</text>
    <text x="640" y="160" fill="#94a3b8" font-size="8" text-anchor="middle">字段加权 / 同义词 / 5 场景</text>
  </g>

  <!-- Arrow: spec → tasks -->
  <line x1="540" y1="175" x2="420" y2="260" stroke="#ff8800" stroke-width="2" marker-end="url(#arrow-orange)"/>
  <text x="500" y="208" fill="#94a3b8" font-size="7" text-anchor="middle">"什么契约" → "分几步"</text>

  <!-- ═══ Tasks Box (Bright Yellow) ═══ -->
  <g filter="url(#glow-yellow)">
    <rect x="290" y="270" width="180" height="80" rx="8" fill="#0f172a"/>
    <rect x="290" y="270" width="180" height="80" rx="8" fill="rgba(255,238,0,0.08)" stroke="#ffee00" stroke-width="3"/>
    <text x="380" y="296" fill="#ffee00" font-size="11" font-weight="700" text-anchor="middle">tasks.md</text>
    <text x="380" y="313" fill="white" font-size="9" font-weight="600" text-anchor="middle">Task 4.2</text>
    <text x="380" y="328" fill="#94a3b8" font-size="8" text-anchor="middle">实现 search_articles 工具</text>
  </g>

  <!-- Arrow: tasks → code -->
  <line x1="470" y1="310" x2="540" y2="310" stroke="#ffee00" stroke-width="2" marker-end="url(#arrow-yellow)"/>
  <text x="505" y="302" fill="#94a3b8" font-size="7" text-anchor="middle">"分几步"</text>
  <text x="505" y="325" fill="#64748b" font-size="7" text-anchor="middle">→ "最终产出"</text>

  <!-- ═══ Code Box (Bright Pink) ═══ -->
  <g filter="url(#glow-pink)">
    <rect x="550" y="270" width="200" height="80" rx="8" fill="#0f172a"/>
    <rect x="550" y="270" width="200" height="80" rx="8" fill="rgba(255,0,102,0.08)" stroke="#ff0066" stroke-width="3"/>
    <text x="650" y="296" fill="#ff0066" font-size="11" font-weight="700" text-anchor="middle">mcp_knowledge_server.py</text>
    <text x="650" y="313" fill="white" font-size="9" font-weight="600" text-anchor="middle">ArticleStore.search()</text>
    <text x="650" y="328" fill="#94a3b8" font-size="8" text-anchor="middle">jieba分词 → 倒排 → 加权排序</text>
  </g>

  <!-- ═══ 命名映射区域 ═══ -->
  <g>
    <rect x="40" y="400" width="700" height="130" rx="12" fill="none" stroke="#475569" stroke-width="1" stroke-dasharray="8,4"/>
    <text x="55" y="420" fill="#64748b" font-size="9" font-weight="600">命名映射：Capability → Spec 目录 → 代码</text>
  </g>

  <g filter="url(#glow-cyan)">
    <rect x="70" y="440" width="160" height="50" rx="6" fill="#0f172a"/>
    <rect x="70" y="440" width="160" height="50" rx="6" fill="rgba(0,170,255,0.08)" stroke="#00aaff" stroke-width="2"/>
    <text x="150" y="462" fill="#00aaff" font-size="9" font-weight="700" text-anchor="middle">knowledge-search</text>
    <text x="150" y="477" fill="#94a3b8" font-size="8" text-anchor="middle">Capability 名称</text>
  </g>
  <line x1="230" y1="465" x2="280" y2="465" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <text x="255" y="458" fill="#94a3b8" font-size="7" text-anchor="middle">同名目录</text>

  <g filter="url(#glow-orange)">
    <rect x="290" y="440" width="180" height="50" rx="6" fill="#0f172a"/>
    <rect x="290" y="440" width="180" height="50" rx="6" fill="rgba(255,136,0,0.08)" stroke="#ff8800" stroke-width="2"/>
    <text x="380" y="462" fill="#ff8800" font-size="9" font-weight="700" text-anchor="middle">specs/knowledge-search/</text>
    <text x="380" y="477" fill="#94a3b8" font-size="8" text-anchor="middle">Spec 目录</text>
  </g>
  <line x1="470" y1="465" x2="520" y2="465" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <text x="495" y="458" fill="#94a3b8" font-size="7" text-anchor="middle">对应实现</text>

  <g filter="url(#glow-pink)">
    <rect x="530" y="440" width="180" height="50" rx="6" fill="#0f172a"/>
    <rect x="530" y="440" width="180" height="50" rx="6" fill="rgba(255,0,102,0.08)" stroke="#ff0066" stroke-width="2"/>
    <text x="620" y="462" fill="#ff0066" font-size="9" font-weight="700" text-anchor="middle">search_articles 工具</text>
    <text x="620" y="477" fill="#94a3b8" font-size="8" text-anchor="middle">MCP Tool 名称</text>
  </g>

  <!-- 图例 -->
  <g transform="translate(780, 100)">
    <text x="0" y="0" fill="#94a3b8" font-size="10" font-weight="600">每个文件回答的问题</text>
    <rect x="0" y="14" width="12" height="12" rx="2" fill="rgba(0,170,255,0.08)" stroke="#00aaff" stroke-width="2"/>
    <text x="18" y="24" fill="#cbd5e1" font-size="8">为什么/是什么</text>
    <rect x="0" y="34" width="12" height="12" rx="2" fill="rgba(0,255,68,0.08)" stroke="#00ff44" stroke-width="2"/>
    <text x="18" y="44" fill="#cbd5e1" font-size="8">怎么做</text>
    <rect x="0" y="54" width="12" height="12" rx="2" fill="rgba(255,136,0,0.08)" stroke="#ff8800" stroke-width="2"/>
    <text x="18" y="64" fill="#cbd5e1" font-size="8">什么契约</text>
    <rect x="0" y="74" width="12" height="12" rx="2" fill="rgba(255,238,0,0.08)" stroke="#ffee00" stroke-width="2"/>
    <text x="18" y="84" fill="#cbd5e1" font-size="8">分几步</text>
    <rect x="0" y="94" width="12" height="12" rx="2" fill="rgba(255,0,102,0.08)" stroke="#ff0066" stroke-width="2"/>
    <text x="18" y="104" fill="#cbd5e1" font-size="8">最终产出</text>
  </g>
</svg>
