<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap');
      text { font-family: 'JetBrains Mono', 'Noto Sans SC', 'PingFang SC', sans-serif; }
    </style>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.5"/>
    </pattern>
    <marker id="arrow-cyan" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#22d3ee"/>
    </marker>
    <marker id="arrow-emerald" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#34d399"/>
    </marker>
    <marker id="arrow-violet" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#a78bfa"/>
    </marker>
    <marker id="arrow-amber" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#fbbf24"/>
    </marker>
    <marker id="arrow-slate" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#94a3b8"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="100%" height="100%" fill="#0f172a"/>
  <rect width="100%" height="100%" fill="url(#grid)"/>

  <!-- Title -->
  <text x="30" y="36" fill="white" font-size="16" font-weight="700">knowledge-search 四文件串联关系</text>
  <text x="30" y="54" fill="#94a3b8" font-size="10">OpenSpec change: add-mcp-knowledge-server</text>

  <!-- === Proposal Box (Primary) === -->
  <g>
    <rect x="40" y="100" width="180" height="80" rx="8" fill="#0f172a"/>
    <rect x="40" y="100" width="180" height="80" rx="8" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="130" y="126" fill="#22d3ee" font-size="11" font-weight="600" text-anchor="middle">proposal.md</text>
    <text x="130" y="143" fill="white" font-size="9" text-anchor="middle">Capabilities</text>
    <text x="130" y="158" fill="#94a3b8" font-size="8" text-anchor="middle">knowledge-search</text>
  </g>

  <!-- Arrow: proposal → design -->
  <line x1="220" y1="140" x2="280" y2="140" stroke="#22d3ee" stroke-width="1.5" marker-end="url(#arrow-cyan)"/>
  <text x="250" y="132" fill="#94a3b8" font-size="7" text-anchor="middle">"为什么"</text>
  <text x="250" y="155" fill="#64748b" font-size="7" text-anchor="middle">→ "怎么做"</text>

  <!-- === Design Box (Secondary) === -->
  <g>
    <rect x="290" y="100" width="180" height="80" rx="8" fill="#0f172a"/>
    <rect x="290" y="100" width="180" height="80" rx="8" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1.5"/>
    <text x="380" y="126" fill="#34d399" font-size="11" font-weight="600" text-anchor="middle">design.md</text>
    <text x="380" y="143" fill="white" font-size="9" text-anchor="middle">Decisions</text>
    <text x="380" y="158" fill="#94a3b8" font-size="8" text-anchor="middle">jieba + 倒排索引 + 字段加权</text>
  </g>

  <!-- Arrow: design → spec -->
  <line x1="470" y1="140" x2="530" y2="140" stroke="#34d399" stroke-width="1.5" marker-end="url(#arrow-emerald)"/>
  <text x="500" y="132" fill="#94a3b8" font-size="7" text-anchor="middle">"怎么做"</text>
  <text x="500" y="155" fill="#64748b" font-size="7" text-anchor="middle">→ "什么契约"</text>

  <!-- === Spec Box (Tertiary) === -->
  <g>
    <rect x="540" y="90" width="200" height="100" rx="8" fill="#0f172a"/>
    <rect x="540" y="90" width="200" height="100" rx="8" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="640" y="116" fill="#a78bfa" font-size="11" font-weight="600" text-anchor="middle">specs/knowledge-search/spec.md</text>
    <text x="640" y="133" fill="white" font-size="9" text-anchor="middle">Tool: search_articles</text>
    <text x="640" y="148" fill="#94a3b8" font-size="8" text-anchor="middle">keyword / limit / source 参数</text>
    <text x="640" y="160" fill="#94a3b8" font-size="8" text-anchor="middle">字段加权 / 同义词 / 5 场景</text>
  </g>

  <!-- Arrow: spec → tasks -->
  <line x1="540" y1="175" x2="420" y2="260" stroke="#a78bfa" stroke-width="1.5" marker-end="url(#arrow-violet)"/>
  <text x="500" y="208" fill="#94a3b8" font-size="7" text-anchor="middle">"什么契约" → "分几步"</text>

  <!-- === Tasks Box (Accent) === -->
  <g>
    <rect x="290" y="270" width="180" height="80" rx="8" fill="#0f172a"/>
    <rect x="290" y="270" width="180" height="80" rx="8" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1.5"/>
    <text x="380" y="296" fill="#fbbf24" font-size="11" font-weight="600" text-anchor="middle">tasks.md</text>
    <text x="380" y="313" fill="white" font-size="9" text-anchor="middle">Task 4.2</text>
    <text x="380" y="328" fill="#94a3b8" font-size="8" text-anchor="middle">实现 search_articles 工具</text>
  </g>

  <!-- Arrow: tasks → code -->
  <line x1="470" y1="310" x2="540" y2="310" stroke="#fbbf24" stroke-width="1.5" marker-end="url(#arrow-amber)"/>
  <text x="505" y="302" fill="#94a3b8" font-size="7" text-anchor="middle">"分几步"</text>
  <text x="505" y="325" fill="#64748b" font-size="7" text-anchor="middle">→ "最终产出"</text>

  <!-- === Code Box (Highlight) === -->
  <g>
    <rect x="550" y="270" width="200" height="80" rx="8" fill="#0f172a"/>
    <rect x="550" y="270" width="200" height="80" rx="8" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="650" y="296" fill="#60a5fa" font-size="11" font-weight="600" text-anchor="middle">mcp_knowledge_server.py</text>
    <text x="650" y="313" fill="white" font-size="9" text-anchor="middle">ArticleStore.search()</text>
    <text x="650" y="328" fill="#94a3b8" font-size="8" text-anchor="middle">jieba分词→倒排→加权排序</text>
  </g>

  <!-- Name mapping region -->
  <g>
    <rect x="40" y="400" width="700" height="130" rx="12" fill="none" stroke="#64748b" stroke-width="1" stroke-dasharray="8,4"/>
    <text x="55" y="420" fill="#64748b" font-size="9" font-weight="600">命名映射：Capability → Spec 目录 → 代码</text>
  </g>

  <!-- name mapping boxes -->
  <g>
    <rect x="70" y="440" width="160" height="50" rx="6" fill="#0f172a"/>
    <rect x="70" y="440" width="160" height="50" rx="6" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1.5"/>
    <text x="150" y="462" fill="#22d3ee" font-size="9" font-weight="600" text-anchor="middle">knowledge-search</text>
    <text x="150" y="477" fill="#94a3b8" font-size="8" text-anchor="middle">Capability 名称</text>
  </g>
  <line x1="230" y1="465" x2="280" y2="465" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <text x="255" y="458" fill="#94a3b8" font-size="7" text-anchor="middle">同名目录</text>

  <g>
    <rect x="290" y="440" width="180" height="50" rx="6" fill="#0f172a"/>
    <rect x="290" y="440" width="180" height="50" rx="6" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1.5"/>
    <text x="380" y="462" fill="#a78bfa" font-size="9" font-weight="600" text-anchor="middle">specs/knowledge-search/</text>
    <text x="380" y="477" fill="#94a3b8" font-size="8" text-anchor="middle">Spec 目录</text>
  </g>
  <line x1="470" y1="465" x2="520" y2="465" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow-slate)"/>
  <text x="495" y="458" fill="#94a3b8" font-size="7" text-anchor="middle">对应实现</text>

  <g>
    <rect x="530" y="440" width="180" height="50" rx="6" fill="#0f172a"/>
    <rect x="530" y="440" width="180" height="50" rx="6" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="620" y="462" fill="#60a5fa" font-size="9" font-weight="600" text-anchor="middle">search_articles 工具</text>
    <text x="620" y="477" fill="#94a3b8" font-size="8" text-anchor="middle">MCP Tool 名称</text>
  </g>

  <!-- Question legend -->
  <g transform="translate(780, 100)">
    <text x="0" y="0" fill="#94a3b8" font-size="10" font-weight="600">每个文件回答的问题</text>
    <rect x="0" y="12" width="12" height="12" rx="2" fill="rgba(8,51,68,0.4)" stroke="#22d3ee" stroke-width="1"/>
    <text x="18" y="22" fill="#94a3b8" font-size="8">为什么/是什么</text>
    <rect x="0" y="32" width="12" height="12" rx="2" fill="rgba(6,78,59,0.4)" stroke="#34d399" stroke-width="1"/>
    <text x="18" y="42" fill="#94a3b8" font-size="8">怎么做</text>
    <rect x="0" y="52" width="12" height="12" rx="2" fill="rgba(76,29,149,0.4)" stroke="#a78bfa" stroke-width="1"/>
    <text x="18" y="62" fill="#94a3b8" font-size="8">什么契约</text>
    <rect x="0" y="72" width="12" height="12" rx="2" fill="rgba(120,53,15,0.3)" stroke="#fbbf24" stroke-width="1"/>
    <text x="18" y="82" fill="#94a3b8" font-size="8">分几步</text>
    <rect x="0" y="92" width="12" height="12" rx="2" fill="rgba(59,130,246,0.3)" stroke="#60a5fa" stroke-width="1"/>
    <text x="18" y="102" fill="#94a3b8" font-size="8">最终产出</text>
  </g>
</svg>
